<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4 Star Massage Edegem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 4 Wix-pagina's via #hash — Home (vandaag/morgen), Onze dames, Profiel per dame (dynamische pagina), Beheer (beveiligd) */
:root{
  --bg:#1a1216; --bg-2:#241a1f; --surface:#2e2228; --line:#4a3840;
  --fg:#f3e9e4; --muted:#b9a7a3; --brass:#d6b27a; --rose:#c9737c; --ok:#7fc49a; --wa:#25d366;
  --display:"Italiana","Didot",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--brass)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:64px}
section.alt{background:var(--bg-2)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:clamp(2rem,4.5vw,2.8rem);margin-bottom:8px}
.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:600}
.lead{color:var(--muted);max-width:60ch;margin:8px 0 28px}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:700;text-decoration:none;font-size:1rem;border:1px solid transparent;cursor:pointer;font-family:var(--body)}
.btn svg{width:20px;height:20px;flex:none}
.btn-wa{background:var(--wa);color:#0b2414}
.btn-call{background:transparent;border-color:var(--brass);color:var(--brass)}
.btn-brass{background:var(--brass);color:#24170c}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn-sm{padding:8px 14px;font-size:.85rem}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(26,18,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.logo{font-family:var(--display);font-size:1.6rem;color:var(--fg);text-decoration:none;white-space:nowrap}
.logo span{color:var(--brass)}
.nav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0;font-size:.9rem;flex-wrap:wrap}
.nav ul a{color:var(--muted);text-decoration:none}
.nav ul a:hover,.nav ul a[aria-current="page"]{color:var(--fg)}
.nav ul a[aria-current="page"]{border-bottom:1px solid var(--brass)}
.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang-switch button{font:inherit;font-size:.8rem;font-weight:700;letter-spacing:.06em;padding:6px 12px;background:none;border:0;color:var(--muted);cursor:pointer}
.lang-switch button[aria-pressed="true"]{background:var(--brass);color:#24170c}
.gate .lang-switch{margin-bottom:4px}
@media (max-width:640px){.nav{flex-wrap:wrap}.nav ul{gap:14px;font-size:.85rem}}

@media (max-width:700px){.bg-gordijn{background-size:auto 520px,auto 520px,auto}}
.bg-satijn .price-card,.bg-satijn .pay-item,.bg-goud .mapslot{background-color:rgba(36,26,31,.82);backdrop-filter:blur(3px)}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1.05;max-width:14ch}
.hero p{color:var(--muted);max-width:46ch;font-size:1.1rem;margin:18px 0 28px}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:30px;font-size:.9rem;color:var(--muted)}
.facts b{color:var(--fg);font-weight:600}
.open-now{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;margin-bottom:18px;padding:6px 12px;border-radius:999px;background:rgba(127,196,154,.12);color:var(--ok)}
.open-now i{width:8px;height:8px;border-radius:50%;background:currentColor}
.open-now.closed{background:rgba(201,115,124,.14);color:var(--rose)}

/* vandaag / morgen */
.days{display:grid;grid-template-columns:1.6fr 1fr;gap:32px}
@media (max-width:820px){.days{grid-template-columns:1fr}}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.day-head h3{font-size:1.9rem}
.day-head span{color:var(--muted);font-size:.9rem}
.today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card:hover .portrait{filter:brightness(1.15)}
.portrait{aspect-ratio:3/4;max-width:100%;width:100%;display:grid;place-items:center;font-family:var(--display);font-size:3rem;color:rgba(243,233,228,.55);background:linear-gradient(170deg,var(--c1),var(--c2));background-size:cover;background-position:center}
.card-body{padding:10px 14px 14px;display:grid;gap:2px}
.card-body h4{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0}
.hrs{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{justify-self:start;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(127,196,154,.14);color:var(--ok);margin-top:6px}
.tomorrow-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tomorrow-list a{display:flex;align-items:center;gap:14px;padding:8px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;background:var(--surface)}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:rgba(243,233,228,.6);background:linear-gradient(170deg,var(--c1),var(--c2));background-size:cover;background-position:center}
.tomorrow-list b{font-weight:600;display:block}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center}

/* tarieven */
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.price-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.price-card h3{font-size:1.8rem;margin-bottom:4px}
.price-card p{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.price-list{list-style:none;margin:0;padding:0}
.price-list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.price-list b{font-family:var(--display);font-size:1.6rem;font-weight:400;color:var(--brass)}
.note{font-size:.85rem;color:var(--muted);margin-top:16px}

.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.pay-item{display:flex;gap:16px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:14px}
.pay-icon{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--brass)}
.pay-icon svg{width:28px;height:28px}
.pay-item h3{font-family:var(--body);font-size:1.05rem;font-weight:700}
.pay-item p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

.info{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
@media (max-width:760px){.info{grid-template-columns:1fr}}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:12px 20px;margin:0}
.info dt{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;padding-top:3px}
.info dd{margin:0;min-width:0}
.mapslot{min-height:240px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:20px;background:repeating-linear-gradient(45deg,#231a1e 0 14px,#271d22 14px 28px);color:var(--muted)}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 28px;list-style:none;margin:0;padding:0}
.rules li{padding-left:18px;border-left:2px solid var(--brass)}
.rules b{display:block}
.rules span{color:var(--muted);font-size:.9rem}

/* dames-overzicht */
.ladies{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.ladies .card-body p{margin:4px 0 0;font-size:.88rem;color:var(--muted)}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(214,178,122,.14);color:var(--brass);justify-self:start;margin-top:8px}

/* profiel */
.profile{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:start}
@media (max-width:820px){.profile{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gallery .portrait:first-child{grid-column:1/-1;aspect-ratio:4/5;font-size:5rem}
.gallery .portrait{border-radius:12px}
.profile h1{font-size:clamp(2.6rem,6vw,4rem)}
.profile .bio{color:var(--fg);max-width:55ch}
.facts-list{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:20px 0;font-size:.95rem}
.facts-list dt{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;padding-top:2px}
.facts-list dd{margin:0}
.next-dates{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.next-dates li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.next-dates li.today{border-color:var(--ok);color:var(--ok)}
.back{display:inline-block;margin-bottom:20px;color:var(--muted);text-decoration:none;font-size:.9rem}

/* beheer */
.admin-bar{background:#3a2a1a;border:1px dashed #c08a3a;color:#ffd9a0;border-radius:12px;padding:12px 16px;font-size:.88rem;margin-bottom:28px}
.admin{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;min-width:0}
.panel h3{font-family:var(--body);font-weight:700;font-size:1.05rem}
.field{display:grid;gap:6px}
.field label{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:.8rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.plan-day{display:grid;gap:6px}
.plan-day h4{margin:10px 0 2px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.plan-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
.plan-item button{font:inherit;font-size:.78rem;background:none;border:1px solid var(--line);color:var(--rose);border-radius:8px;padding:4px 10px;cursor:pointer}
.toast{font-size:.85rem;color:var(--ok);min-height:1.2em}
.notice{background:var(--brass);color:#24170c;font-weight:600;font-size:.95rem}
.notice .wrap{padding-block:10px;text-align:center}
.field>span{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.admin-wide{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:860px){.admin-wide{grid-template-columns:1fr}}
.panel.full{grid-column:1/-1}
.tar-f{border:1px solid var(--line);border-radius:12px;padding:16px;margin:0;display:grid;gap:12px;min-width:0}
.tar-f legend{padding:0 6px;color:var(--brass);font-weight:700;font-size:.85rem}
.tar-f.off{opacity:.55}
.tar-rows{display:grid;gap:8px}
.tar-row{display:grid;grid-template-columns:90px auto auto 110px auto;gap:8px;align-items:center;justify-content:start}
.tar-row input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;font-variant-numeric:tabular-nums}
.tar-row span{color:var(--muted);font-size:.85rem}
.tar-row button,.x-btn{font:inherit;font-size:.78rem;background:none;border:1px solid var(--line);color:var(--rose);border-radius:8px;padding:6px 10px;cursor:pointer}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--fg);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brass)}
.unsaved{color:#ffd9a0;font-size:.85rem}
.err{color:var(--rose)}

footer{border-top:1px solid var(--line);padding-block:40px 110px;font-size:.85rem;color:var(--muted)}
.foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.foot h4{color:var(--fg);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ph{background:rgba(214,178,122,.18);color:var(--brass);border-radius:4px;padding:0 4px}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.45)}

const view=document.getElementById("view");
let TDRAFT=null;   // tarieven in bewerking, nog niet opgeslagen
function render(keep){
  const h=(location.hash||"#home").slice(1);
  const sy=window.scrollY;
  let html,nav="home";
  if(h==="dames"){html=viewDames();nav="dames";}
  else if(h.startsWith("dame-")){html=viewDame(h.slice(5));nav="dames";}
  else if(h==="beheer"){html=beheerOK?viewBeheer():viewLogin();nav="beheer";}
  else {html=viewHome();nav=h==="home-tarieven"?"tarieven":h==="home-contact"?"contact":"home";}
  view.innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===nav)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const nt=MEDE.aan?(LANG==="en"&&MEDE.en?MEDE.en:MEDE.nl):"";
  document.getElementById("notice").hidden=!nt||h==="beheer";
  document.getElementById("notice-text").textContent=nt;
  if(keep===true){window.scrollTo(0,sy);}
  else if(h.startsWith("home-")){document.getElementById(h)?.scrollIntoView();}else{window.scrollTo(0,0);}
  if(h==="beheer"){beheerOK?bindBeheer():bindLogin();}
}
window.addEventListener("hashchange",()=>{TDRAFT=null;render();});

function bindBeheer(){
  document.getElementById("b-uit").addEventListener("click",()=>{beheerOK=false;try{sessionStorage.removeItem("beheerOK")}catch(e){};location.hash="home";});
  document.querySelectorAll(".chips button").forEach(b=>b.addEventListener("click",()=>{const[v,t]=b.dataset.u.split("-");document.getElementById("p-van").value=v;document.getElementById("p-tot").value=t;}));
  document.getElementById("f-plan").addEventListener("submit",e=>{
    e.preventDefault();
    const p={dame:document.getElementById("p-dame").value,datum:document.getElementById("p-datum").value,van:document.getElementById("p-van").value,tot:document.getElementById("p-tot").value};
    const t=document.getElementById("t-plan");
    if(p.tot<=p.van){t.textContent="Het einduur moet na het beginuur liggen.";t.className="toast err";return;}
    if(PLAN.some(x=>x.dame===p.dame&&x.datum===p.datum&&p.van<x.tot&&x.van<p.tot)){t.textContent=dame(p.dame).naam+" staat op dat moment al ingepland.";t.className="toast err";return;}
    const sl=dicht(p.datum);
    PLAN.push(p);bewaar();render(true);
    if(sl){const w=document.getElementById("t-plan");w.className="toast err";w.textContent="Let op: deze dag staat als gesloten ingesteld. De dame verschijnt niet op de site tot je de sluiting verwijdert.";return;}
    const t2=document.getElementById("t-plan");t2.textContent=`Toegevoegd: ${dame(p.dame).naam}, ${fmtDate(p.datum)}, ${uren(p)}.`;
  });
  document.getElementById("f-dame").addEventListener("submit",e=>{
    e.preventDefault();
    const naam=document.getElementById("d-naam").value.trim();
    const id=naam.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"")||"dame"+DAMES.length;
    const nieuw={id:DAMES.some(d=>d.id===id)?id+DAMES.length:id,naam,actief:true,c:["#5a3a48","#1f1418"],
      kort:document.getElementById("d-kort").value.trim()||"Nieuw in het team",talen:document.getElementById("d-talen").value.trim()||"NL",
      tekst:document.getElementById("d-tekst").value.trim()||"Voorstelling volgt.",kortEn:document.getElementById("d-kort-en").value.trim(),tekstEn:document.getElementById("d-tekst-en").value.trim(),foto:null};
    const file=document.getElementById("d-foto").files[0];
    const klaar=()=>{DAMES.push(nieuw);const ok=bewaar();render(true);if(!ok)document.getElementById("t-dame").className="toast err";document.getElementById("t-dame").textContent=`${naam} is toegevoegd en staat nu bij Onze dames.`;};
    if(file){verklein(file,600).then(u=>{nieuw.foto=u;klaar();}).catch(()=>klaar());}else klaar();
  });
  view.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{PLAN.splice(+b.dataset.del,1);bewaar();render(true);}));
  view.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{const d=dame(b.dataset.toggle);d.actief=!d.actief;bewaar();render(true);}));
  /* Demo terugzetten */
  const rs=document.getElementById("b-reset");
  rs.addEventListener("click",()=>{
    if(rs.dataset.zeker!=="1"){rs.dataset.zeker="1";rs.textContent="Klik nogmaals om alles te wissen";document.getElementById("t-reset").textContent="Alle wijzigingen in deze browser gaan verloren.";return;}
    try{localStorage.removeItem(OPSLAG)}catch(e){}
    location.reload();
  });

  /* Mededeling */
  document.getElementById("f-mede").addEventListener("submit",e=>{
    e.preventDefault();
    MEDE={aan:document.getElementById("m-aan").checked,nl:document.getElementById("m-nl").value.trim(),en:document.getElementById("m-en").value.trim()};
    if(MEDE.aan&&!MEDE.nl){const w=document.getElementById("t-mede");w.className="toast err";w.textContent="Vul eerst een Nederlandse tekst in.";return;}
    bewaar();render(true);
    document.getElementById("t-mede").textContent=MEDE.aan?"Opgeslagen. De mededeling staat nu bovenaan de site.":"Opgeslagen. Er staat geen mededeling op de site.";
  });

  /* Sluitingsdagen */
  document.getElementById("f-sluit").addEventListener("submit",e=>{
    e.preventDefault();
    const x={datum:document.getElementById("s-datum").value,nl:document.getElementById("s-nl").value.trim(),en:document.getElementById("s-en").value.trim()};
    const w=document.getElementById("t-sluit");
    if(!x.datum||x.datum<TODAY){w.className="toast err";w.textContent="Kies vandaag of een latere datum.";return;}
    if(dicht(x.datum)){w.className="toast err";w.textContent="Die dag staat al als gesloten.";return;}
    const gepland=PLAN.filter(p=>p.datum===x.datum).map(p=>dame(p.dame)?.naam).filter(Boolean);
    SLUIT.push(x);bewaar();render(true);
    const w2=document.getElementById("t-sluit");
    w2.textContent=`Gesloten op ${fmtDate(x.datum)} toegevoegd.`+(gepland.length?` Let op: ${gepland.join(", ")} ${gepland.length>1?"stonden":"stond"} die dag ingepland en ${gepland.length>1?"worden":"wordt"} niet getoond.`:"");
  });
  view.querySelectorAll("[data-delsluit]").forEach(b=>b.addEventListener("click",()=>{SLUIT=SLUIT.filter(x=>x.datum!==b.dataset.delsluit);bewaar();render(true);}));

  /* Tarieven */
  const leesTarieven=()=>[...view.querySelectorAll(".tar-f")].map(fs=>({
    nl:fs.querySelector('[data-k="nl"]').value.trim(),
    en:fs.querySelector('[data-k="en"]').value.trim(),
    unl:fs.querySelector('[data-k="unl"]').value.trim(),
    uen:fs.querySelector('[data-k="uen"]').value.trim(),
    actief:fs.querySelector('[data-k="actief"]').checked,
    rijen:[...fs.querySelectorAll(".tar-row")].map(r=>({min:parseInt(r.querySelector("[data-min]").value,10),prijs:parseInt(r.querySelector("[data-prijs]").value,10)}))
  }));
  const wijzig=fn=>{TDRAFT=leesTarieven();fn(TDRAFT);render(true);};
  view.querySelectorAll("[data-addrij]").forEach(b=>b.addEventListener("click",()=>wijzig(d=>d[+b.dataset.addrij].rijen.push({min:45,prijs:0}))));
  view.querySelectorAll("[data-delrij]").forEach(b=>b.addEventListener("click",()=>{const[fi,ri]=b.dataset.delrij.split("-").map(Number);wijzig(d=>d[fi].rijen.splice(ri,1));}));
  view.querySelectorAll("[data-delf]").forEach(b=>b.addEventListener("click",()=>wijzig(d=>d.splice(+b.dataset.delf,1))));
  document.getElementById("b-addf").addEventListener("click",()=>wijzig(d=>d.push({nl:"Nieuwe formule",en:"",unl:"",uen:"",actief:false,rijen:[{min:30,prijs:0}]})));
  view.querySelectorAll('#f-tar input').forEach(i=>i.addEventListener("input",()=>{if(!TDRAFT){TDRAFT=leesTarieven();}}));
  document.getElementById("f-tar").addEventListener("submit",e=>{
    e.preventDefault();
    const d=leesTarieven();
    const fout=d.findIndex(f=>!f.nl||!f.rijen.length||f.rijen.some(r=>!(r.min>0)||!(r.prijs>=0)));
    const w=document.getElementById("t-tar");
    if(fout>=0){w.className="toast err";w.textContent=`Formule ${fout+1}: vul een naam in en geef elke duur een geldig aantal minuten en een prijs.`;return;}
    TARIEF=d;TDRAFT=null;bewaar();render(true);
    document.getElementById("t-tar").textContent="Tarieven opgeslagen. Ze staan nu op de site.";
  });
}

/* Foto verkleinen zodat ze in de browseropslag past */
function verklein(file,max){
  return new Promise((ok,nok)=>{
    const r=new FileReader();
    r.onerror=nok;
    r.onload=()=>{const img=new Image();img.onerror=nok;img.onload=()=>{
      const f=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*f);c.height=Math.round(img.height*f);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",0.8));};img.src=r.result;};
    r.readAsDataURL(file);
  });
}
